<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrazione</title>
</head>
<body>
<h1>Registrazione</h1>

<form th:action="@{/register}" method="post">
    <label>Nick
        <input type="text" name="nick" th:value="${nick}" />
    </label>
    <span th:if="${nickTaken}">Nick già registrato</span>

    <label>Password
        <input type="password" name="password" />
    </label>

    <button type="submit">Registrati</button>
</form>
</body>
</html>
